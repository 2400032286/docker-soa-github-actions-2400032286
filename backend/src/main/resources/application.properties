spring.application.name=HomeCleaningBookingServiceProject

server.port=5001

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=postgres
spring.datasource.password=admin123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

eureka.instance.appname=home cleaning booking-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

management.info.env.enabled=true
management.endpoints.web.exposure.include=*

info.app.name=home cleaning booking-service
info.app.description=home cleaning booking service project
info.app.author=sravani cherukuru
info.app.version=1.0

